<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Animals - Asim Tech Kids</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f7ff;
  text-align: center;
}

header {
  background: #6c5ce7;
  color: white;
  padding: 25px 10px;
  border-radius: 0 0 30px 30px;
}

h1 {
  margin: 5px;
  font-size: 28px;
}

header p {
  margin: 8px;
  font-size: 16px;
}

.container {
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

.title {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.animal-button {
  border: none;
  background: white;
  border-radius: 25px;
  padding: 20px 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.12);
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.animal-button:active {
  transform: scale(0.94);
}

.animal {
  font-size: 65px;
  display: block;
  margin-bottom: 8px;
}

.sound {
  font-size: 14px;
  margin-top: 6px;
  color: #666;
}

.listen-button {
  margin-top: 25px;
  background: #00b894;
  color: white;
  border: none;
  padding: 15px 28px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bold;
}

.home-button {
  margin-top: 20px;
  background: #6c5ce7;
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 25px;
  font-size: 17px;
  font-weight: bold;
}

footer {
  margin-top: 25px;
  padding: 18px;
  color: #666;
  font-size: 14px;
}

</style>

</head>

<body>

<header>

<h1>🐯 Asim Tech Kids</h1>

<p>Learn Animals and Their Sounds</p>

</header>

<div class="container">

<div class="title">

🐾 Tap an Animal to Hear Its Sound

</div>

<div class="grid">


<button class="animal-button"
onclick="animalSound('Dog','Woof Woof')">

<span class="animal">🐶</span>

Dog

<div class="sound">
🔊 Woof Woof
</div>

</button>


<button class="animal-button"
onclick="animalSound('Cat','Meow Meow')">

<span class="animal">🐱</span>

Cat

<div class="sound">
🔊 Meow Meow
</div>

</button>


<button class="animal-button"
onclick="animalSound('Lion','Roar')">

<span class="animal">🦁</span>

Lion

<div class="sound">
🔊 Roar
</div>

</button>


<button class="animal-button"
onclick="animalSound('Cow','Moo Moo')">

<span class="animal">🐮</span>

Cow

<div class="sound">
🔊 Moo Moo
</div>

</button>


<button class="animal-button"
onclick="animalSound('Elephant','Trumpet')">

<span class="animal">🐘</span>

Elephant

<div class="sound">
🔊 Trumpet
</div>

</button>


<button class="animal-button"
onclick="animalSound('Horse','Neigh')">

<span class="animal">🐴</span>

Horse

<div class="sound">
🔊 Neigh
</div>

</button>


<button class="animal-button"
onclick="animalSound('Tiger','Roar')">

<span class="animal">🐯</span>

Tiger

<div class="sound">
🔊 Roar
</div>

</button>


<button class="animal-button"
onclick="animalSound('Monkey','Ooh Ooh Aah Aah')">

<span class="animal">🐒</span>

Monkey

<div class="sound">
🔊 Ooh Ooh Aah Aah
</div>

</button>


<button class="animal-button"
onclick="animalSound('Bird','Chirp Chirp')">

<span class="animal">🐦</span>

Bird

<div class="sound">
🔊 Chirp Chirp
</div>

</button>


<button class="animal-button"
onclick="animalSound('Duck','Quack Quack')">

<span class="animal">🦆</span>

Duck

<div class="sound">
🔊 Quack Quack
</div>

</button>


<button class="animal-button"
onclick="animalSound('Sheep','Baa Baa')">

<span class="animal">🐑</span>

Sheep

<div class="sound">
🔊 Baa Baa
</div>

</button>


<button class="animal-button"
onclick="animalSound('Frog','Ribbit Ribbit')">

<span class="animal">🐸</span>

Frog

<div class="sound">
🔊 Ribbit Ribbit
</div>

</button>


</div>


<button class="listen-button"
onclick="speak('Animals and their sounds')">

🔊 Listen to Animals

</button>


<br>


<button class="home-button"
onclick="location.href='index.html'">

🏠 Home

</button>

</div>

<footer>

Powered by Asim Tech ❤️

</footer>


<script>

function animalSound(animal, sound) {

  speak(
    animal + ". " + sound
  );

}


function speak(text) {

  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

    const message =
      new SpeechSynthesisUtterance(text);

    message.lang =
      "en-US";

    message.rate =
      0.75;

    message.pitch =
      1.2;

    window.speechSynthesis.speak(message);

  }

}

</script>

</body>

</html>
