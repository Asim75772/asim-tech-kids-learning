<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>বাংলা - Asim Tech Kids</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f7ff;
  text-align: center;
  overflow-x: hidden;
}

header {
  background: #6c5ce7;
  color: white;
  padding: 25px 10px;
  border-radius: 0 0 30px 30px;
}

h1 {
  margin: 5px;
  font-size: 29px;
}

header p {
  margin: 8px;
  font-size: 17px;
}

.container {
  padding: 20px;
  max-width: 700px;
  margin: auto;
}

.learning-card {
  background: white;
  border-radius: 30px;
  padding: 25px 15px;
  margin-bottom: 20px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

.big-letter {
  font-size: 90px;
  font-weight: bold;
  color: #6c5ce7;
  margin: 5px;
}

.big-letter.animate {
  animation: bounce 0.7s ease;
}

@keyframes bounce {

  0% {
    transform: scale(0.5);
    opacity: 0;
  }

  50% {
    transform: scale(1.3);
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }

}

.word {
  font-size: 28px;
  font-weight: bold;
  margin: 12px;
}

.listen-button {
  background: #00b894;
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bold;
  margin-top: 10px;
}

.section-title {
  background: #6c5ce7;
  color: white;
  border-radius: 20px;
  padding: 12px;
  margin-top: 20px;
  margin-bottom: 12px;
  font-size: 21px;
  font-weight: bold;
}

.letters {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
}

.letter-button {
  border: none;
  background: white;
  border-radius: 15px;
  padding: 14px 5px;
  font-size: 24px;
  font-weight: bold;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  cursor: pointer;
}

.letter-button:active {
  transform: scale(0.9);
}

.home-button {
  margin-top: 25px;
  background: #6c5ce7;
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 25px;
  font-size: 17px;
  font-weight: bold;
}

footer {
  margin-top: 25px;
  padding: 18px;
  color: #666;
  font-size: 14px;
}

.star {
  position: fixed;
  font-size: 25px;
  pointer-events: none;
  animation: fly 1s ease-out forwards;
}

@keyframes fly {

  0% {
    transform: translate(0,0) scale(0.5);
    opacity: 1;
  }

  100% {
    transform:
      translate(var(--x), var(--y))
      scale(1.5);
    opacity: 0;
  }

}

</style>

</head>

<body>

<header>

<h1>🔤 Asim Tech Kids</h1>

<p>বাংলা বর্ণমালা শিখি</p>

</header>

<div class="container">

<div class="learning-card">

<div class="big-letter" id="bigLetter">
অ
</div>

<div class="word" id="word">
অ — অজগর
</div>

<button class="listen-button"
onclick="listenCurrent()">

🔊 শুনুন

</button>

</div>


<div class="section-title">

স্বরবর্ণ

</div>

<div class="letters"
id="vowels">

</div>


<div class="section-title">

ব্যঞ্জনবর্ণ

</div>

<div class="letters"
id="consonants">

</div>


<button class="home-button"
onclick="location.href='index.html'">

🏠 Home

</button>

</div>

<footer>

Powered by Asim Tech ❤️

</footer>


<script>


/* বাংলা স্বরবর্ণ */

const vowels = [

["অ", "অজগর"],
["আ", "আম"],
["ই", "ইলিশ"],
["ঈ", "ঈগল"],
["উ", "উট"],
["ঊ", "ঊষা"],
["ঋ", "ঋষি"],
["এ", "একতারা"],
["ঐ", "ঐরাবত"],
["ও", "ওল"],
["ঔ", "ঔষধ"]

];


/* বাংলা ব্যঞ্জনবর্ণ */

const consonants = [

["ক", "কলা"],
["খ", "খরগোশ"],
["গ", "গরু"],
["ঘ", "ঘড়ি"],
["ঙ", "ঙ — বর্ণ"],
["চ", "চাঁদ"],
["ছ", "ছাতা"],
["জ", "জাহাজ"],
["ঝ", "ঝর্ণা"],
["ঞ", "ঞ — বর্ণ"],
["ট", "টিয়া"],
["ঠ", "ঠেলা"],
["ড", "ডাব"],
["ঢ", "ঢোল"],
["ণ", "ণ — বর্ণ"],
["ত", "তাল"],
["থ", "থালা"],
["দ", "দোয়েল"],
["ধ", "ধনুক"],
["ন", "নৌকা"],
["প", "পাখি"],
["ফ", "ফুল"],
["ব", "বাঘ"],
["ভ", "ভাত"],
["ম", "মাছ"],
["য", "যাদু"],
["র", "রথ"],
["ল", "লাটিম"],
["শ", "শাপলা"],
["ষ", "ষাঁড়"],
["স", "সাপ"],
["হ", "হাতি"]

];


let currentLetter = "অ";

let currentWord = "অজগর";


/* স্বরবর্ণ তৈরি */

function createVowels() {

  const container =
    document.getElementById("vowels");

  vowels.forEach(function(item) {

    const button =
      document.createElement("button");

    button.className =
      "letter-button";

    button.innerText =
      item[0];

    button.onclick =
      function() {

        showLetter(
          item[0],
          item[1]
        );

      };

    container.appendChild(button);

  });

}


/* ব্যঞ্জনবর্ণ তৈরি */

function createConsonants() {

  const container =
    document.getElementById("consonants");

  consonants.forEach(function(item) {

    const button =
      document.createElement("button");

    button.className =
      "letter-button";

    button.innerText =
      item[0];

    button.onclick =
      function() {

        showLetter(
          item[0],
          item[1]
        );

      };

    container.appendChild(button);

  });

}


/* অক্ষর দেখানো এবং সঙ্গে সঙ্গে বলা */

function showLetter(letter, word) {

  currentLetter = letter;

  currentWord = word;

  const bigLetter =
    document.getElementById("bigLetter");

  const wordElement =
    document.getElementById("word");


  bigLetter.classList.remove("animate");

  void bigLetter.offsetWidth;

  bigLetter.classList.add("animate");


  bigLetter.innerText =
    letter;

  wordElement.innerText =
    letter + " — " + word;


  /* সঙ্গে সঙ্গে কথা বলবে */

  speak(
    letter + "। " + word
  );


  celebration();

}


/* Listen button */

function listenCurrent() {

  speak(
    currentLetter +
    "। " +
    currentWord
  );

}


/* বাংলা Speech */

function speak(text) {

  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

    const message =
      new SpeechSynthesisUtterance(text);

    message.lang =
      "bn-IN";

    message.rate =
      0.75;

    message.pitch =
      1.2;

    window.speechSynthesis.speak(message);

  }

}


/* Celebration */

function celebration() {

  const symbols =
    ["⭐", "✨", "🌟", "🎉", "💫"];

  for (let i = 0; i < 8; i++) {

    const star =
      document.createElement("div");

    star.className =
      "star";

    star.innerText =
      symbols[
        Math.floor(
          Math.random() * symbols.length
        )
      ];

    star.style.left =
      "50%";

    star.style.top =
      "40%";

    star.style.setProperty(
      "--x",
      (Math.random() * 300 - 150) + "px"
    );

    star.style.setProperty(
      "--y",
      (Math.random() * 300 - 150) + "px"
    );

    document.body.appendChild(star);

    setTimeout(function() {

      star.remove();

    }, 1000);

  }

}


/* START */

createVowels();

createConsonants();

showLetter("অ", "অজগর");

</script>

</body>

</html>
