<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Numbers - Asim Tech Kids</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f7ff;
  text-align: center;
  overflow-x: hidden;
}

header {
  background: #6c5ce7;
  color: white;
  padding: 25px 10px;
  border-radius: 0 0 30px 30px;
}

h1 {
  margin: 5px;
  font-size: 28px;
}

header p {
  margin: 8px;
  font-size: 16px;
}

.container {
  padding: 20px;
  max-width: 650px;
  margin: auto;
}

.learning-card {
  background: white;
  border-radius: 30px;
  padding: 25px 15px;
  margin-bottom: 20px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

.number {
  font-size: 85px;
  font-weight: bold;
  color: #6c5ce7;
  margin: 5px;
}

.number.animate {
  animation: bounce 0.7s ease;
}

@keyframes bounce {

  0% {
    transform: scale(0.5) rotate(-10deg);
    opacity: 0;
  }

  50% {
    transform: scale(1.3) rotate(10deg);
  }

  100% {
    transform: scale(1) rotate(0deg);
    opacity: 1;
  }

}

.word {
  font-size: 28px;
  font-weight: bold;
  margin: 10px;
}

.listen-button {
  background: #00b894;
  color: white;
  border: none;
  padding: 15px 30px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bold;
  margin-top: 10px;
}

.numbers {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 9px;
  margin-top: 20px;
}

.number-button {
  border: none;
  background: white;
  border-radius: 15px;
  padding: 13px 4px;
  font-size: 18px;
  font-weight: bold;
  box-shadow: 0 3px 10px rgba(0,0,0,0.12);
  cursor: pointer;
}

.number-button:active {
  transform: scale(0.9);
}

.home-button {
  margin-top: 20px;
  background: #6c5ce7;
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 25px;
  font-size: 17px;
  font-weight: bold;
}

footer {
  margin-top: 25px;
  padding: 18px;
  color: #666;
  font-size: 14px;
}

.star {
  position: fixed;
  font-size: 25px;
  pointer-events: none;
  animation: fly 1s ease-out forwards;
}

@keyframes fly {

  0% {
    transform: translate(0,0) scale(0.5);
    opacity: 1;
  }

  100% {
    transform:
      translate(var(--x), var(--y))
      scale(1.5);
    opacity: 0;
  }

}

</style>

</head>

<body>

<header>

<h1>🔢 Asim Tech Kids</h1>

<p>Learn Numbers 1 to 100</p>

</header>

<div class="container">

<div class="learning-card">

<div class="number" id="number">
1
</div>

<div class="word" id="word">
One
</div>

<button class="listen-button"
onclick="listenCurrent()">

🔊 Listen

</button>

</div>

<div class="numbers" id="numbers">
</div>

<button class="home-button"
onclick="location.href='index.html'">

🏠 Home

</button>

</div>

<footer>

Powered by Asim Tech ❤️

</footer>

<script>

const words = [

"One",
"Two",
"Three",
"Four",
"Five",
"Six",
"Seven",
"Eight",
"Nine",
"Ten",

"Eleven",
"Twelve",
"Thirteen",
"Fourteen",
"Fifteen",
"Sixteen",
"Seventeen",
"Eighteen",
"Nineteen",
"Twenty",

"Twenty One",
"Twenty Two",
"Twenty Three",
"Twenty Four",
"Twenty Five",
"Twenty Six",
"Twenty Seven",
"Twenty Eight",
"Twenty Nine",
"Thirty",

"Thirty One",
"Thirty Two",
"Thirty Three",
"Thirty Four",
"Thirty Five",
"Thirty Six",
"Thirty Seven",
"Thirty Eight",
"Thirty Nine",
"Forty",

"Forty One",
"Forty Two",
"Forty Three",
"Forty Four",
"Forty Five",
"Forty Six",
"Forty Seven",
"Forty Eight",
"Forty Nine",
"Fifty",

"Fifty One",
"Fifty Two",
"Fifty Three",
"Fifty Four",
"Fifty Five",
"Fifty Six",
"Fifty Seven",
"Fifty Eight",
"Fifty Nine",
"Sixty",

"Sixty One",
"Sixty Two",
"Sixty Three",
"Sixty Four",
"Sixty Five",
"Sixty Six",
"Sixty Seven",
"Sixty Eight",
"Sixty Nine",
"Seventy",

"Seventy One",
"Seventy Two",
"Seventy Three",
"Seventy Four",
"Seventy Five",
"Seventy Six",
"Seventy Seven",
"Seventy Eight",
"Seventy Nine",
"Eighty",

"Eighty One",
"Eighty Two",
"Eighty Three",
"Eighty Four",
"Eighty Five",
"Eighty Six",
"Eighty Seven",
"Eighty Eight",
"Eighty Nine",
"Ninety",

"Ninety One",
"Ninety Two",
"Ninety Three",
"Ninety Four",
"Ninety Five",
"Ninety Six",
"Ninety Seven",
"Ninety Eight",
"Ninety Nine",
"One Hundred"

];

let currentNumber = 1;


/* CREATE 1 TO 100 BUTTONS */

function createNumberButtons() {

  const container =
    document.getElementById("numbers");

  for (let i = 1; i <= 100; i++) {

    const button =
      document.createElement("button");

    button.className =
      "number-button";

    button.innerText =
      i;

    button.onclick =
      function() {

        showNumber(i);

      };

    container.appendChild(button);

  }

}


/* SHOW NUMBER AND SPEAK AUTOMATICALLY */

function showNumber(number) {

  currentNumber = number;

  const numberElement =
    document.getElementById("number");

  const wordElement =
    document.getElementById("word");

  numberElement.classList.remove("animate");

  void numberElement.offsetWidth;

  numberElement.classList.add("animate");

  numberElement.innerText =
    number;

  wordElement.innerText =
    words[number - 1];

  /* Speak automatically */

  speak(
    "Number " +
    words[number - 1]
  );

  celebration();

}


/* LISTEN BUTTON */

function listenCurrent() {

  speak(
    "Number " +
    words[currentNumber - 1]
  );

}


/* SPEECH */

function speak(text) {

  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

    const message =
      new SpeechSynthesisUtterance(text);

    message.lang =
      "en-US";

    message.rate =
      0.75;

    message.pitch =
      1.2;

    window.speechSynthesis.speak(message);

  }

}


/* STAR CELEBRATION */

function celebration() {

  const symbols =
    ["⭐", "✨", "🌟", "🎉", "💫"];

  for (let i = 0; i < 8; i++) {

    const star =
      document.createElement("div");

    star.className =
      "star";

    star.innerText =
      symbols[
        Math.floor(
          Math.random() * symbols.length
        )
      ];

    star.style.left =
      "50%";

    star.style.top =
      "40%";

    star.style.setProperty(
      "--x",
      (Math.random() * 300 - 150) + "px"
    );

    star.style.setProperty(
      "--y",
      (Math.random() * 300 - 150) + "px"
    );

    document.body.appendChild(star);

    setTimeout(function() {

      star.remove();

    }, 1000);

  }

}


/* START */

createNumberButtons();

showNumber(1);

</script>

</body>

</html>
