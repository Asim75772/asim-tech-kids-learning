<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Asim Tech Kids Learning</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f5f7ff;
  text-align: center;
}

header {
  background: #6c5ce7;
  color: white;
  padding: 28px 10px;
  border-radius: 0 0 30px 30px;
}

h1 {
  margin: 5px;
  font-size: 29px;
}

header p {
  margin: 8px;
  font-size: 16px;
}

.container {
  padding: 20px;
  max-width: 650px;
  margin: auto;
}

.welcome {
  font-size: 22px;
  font-weight: bold;
  margin: 10px 0 22px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.learn-button {
  border: none;
  border-radius: 22px;
  padding: 22px 8px;
  font-size: 18px;
  font-weight: bold;
  background: white;
  box-shadow: 0 5px 15px rgba(0,0,0,0.12);
  cursor: pointer;
  min-height: 125px;
}

.learn-button:active {
  transform: scale(0.95);
}

.icon {
  font-size: 42px;
  display: block;
  margin-bottom: 8px;
}

.bangla-icon {
  font-size: 42px;
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

.sound-button {
  margin-top: 25px;
  background: #00b894;
  color: white;
  border: none;
  padding: 16px 30px;
  border-radius: 30px;
  font-size: 18px;
  font-weight: bold;
}

footer {
  margin-top: 30px;
  padding: 18px;
  color: #666;
  font-size: 14px;
}

</style>

</head>

<body>


<header>

<h1>🌟 Asim Tech Kids</h1>

<p>Fun Learning for Kids</p>

</header>


<div class="container">


<div class="welcome">

👋 Welcome Little Learner!

</div>


<div class="grid">


<!-- ENGLISH -->

<button class="learn-button"
onclick="openPage('alphabet.html')">

<span class="icon">🔤</span>

English

</button>


<!-- NUMBERS -->

<button class="learn-button"
onclick="openPage('numbers.html')">

<span class="icon">🔢</span>

Numbers

</button>


<!-- BANGLA -->

<button class="learn-button"
onclick="openPage('bangla.html')">

<span class="bangla-icon">অ</span>

বাংলা

</button>


<!-- ANIMALS -->

<button class="learn-button"
onclick="openPage('animals.html')">

<span class="icon">🐯</span>

Animals

</button>


<!-- COLOURS -->

<button class="learn-button"
onclick="openPage('colours.html')">

<span class="icon">🎨</span>

Colours

</button>


<!-- QUIZ -->

<button class="learn-button"
onclick="openPage('quiz.html')">

<span class="icon">🧩</span>

Quiz

</button>


</div>


<button class="sound-button"
onclick="welcomeSound()">

🔊 Hear Welcome

</button>


</div>


<footer>

Powered by Asim Tech ❤️

</footer>


<script>


/* OPEN PAGE */

function openPage(page) {

  window.location.href = page;

}


/* WELCOME SOUND */

function welcomeSound() {

  speak(
    "Welcome to Asim Tech Kids Learning"
  );

}


/* SPEECH */

function speak(text) {

  if ("speechSynthesis" in window) {

    window.speechSynthesis.cancel();

    const message =
      new SpeechSynthesisUtterance(text);

    message.lang =
      "en-US";

    message.rate =
      0.8;

    message.pitch =
      1.2;

    window.speechSynthesis.speak(message);

  }

}

</script>


</body>

</html>
