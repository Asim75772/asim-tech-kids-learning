<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asim Tech Kids Learning</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7ff;
      text-align: center;
    }

    header {
      background: #6c5ce7;
      color: white;
      padding: 25px 10px;
      border-radius: 0 0 25px 25px;
    }

    h1 {
      margin: 5px;
      font-size: 28px;
    }

    header p {
      margin: 8px;
      font-size: 16px;
    }

    .container {
      padding: 20px;
    }

    .welcome {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      max-width: 500px;
      margin: auto;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 25px 10px;
      font-size: 18px;
      font-weight: bold;
      background: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.12);
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
    }

    .icon {
      font-size: 40px;
      display: block;
      margin-bottom: 8px;
    }

    .sound {
      margin-top: 25px;
      background: #00b894;
      color: white;
      padding: 15px 30px;
      border-radius: 30px;
      font-size: 18px;
    }

    footer {
      margin-top: 30px;
      padding: 15px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🌟 Asim Tech Kids</h1>
    <p>Fun Learning for Kids</p>
  </header>

  <div class="container">

    <div class="welcome">
      👋 Welcome Little Learner!
    </div>

    <div class="grid">

      <button onclick="speak('English')">
        <span class="icon">🔤</span>
        English
      </button>

      <button onclick="speak('Numbers')">
        <span class="icon">🔢</span>
        Numbers
      </button>

      <button onclick="speak('বাংলা')">
        <span class="icon">🇧🇩</span>
        বাংলা
      </button>

      <button onclick="speak('Animals')">
        <span class="icon">🐯</span>
        Animals
      </button>

      <button onclick="speak('Colours')">
        <span class="icon">🎨</span>
        Colours
      </button>

      <button onclick="speak('Quiz')">
        <span class="icon">🧩</span>
        Quiz
      </button>

    </div>

    <button class="sound" onclick="welcomeSound()">
      🔊 Hear Welcome
    </button>

  </div>

  <footer>
    Powered by Asim Tech ❤️
  </footer>

  <script>

    function speak(text) {
      window.speechSynthesis.cancel();

      const message = new SpeechSynthesisUtterance(text);
      message.rate = 0.8;
      message.pitch = 1.2;

      window.speechSynthesis.speak(message);
    }

    function welcomeSound() {
      speak("Welcome to Asim Tech Kids Learning");
    }

  </script>

</body>
</html>
