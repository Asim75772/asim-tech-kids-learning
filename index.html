<script>


function speak(text) {

  if ('speechSynthesis' in window) {

    window.speechSynthesis.cancel();

    const message =
      new SpeechSynthesisUtterance(text);

    message.lang = "en-US";

    message.rate = 0.8;

    message.pitch = 1.2;

    window.speechSynthesis.speak(message);

  }

}


function welcomeSound() {

  speak(
    "Welcome to Asim Tech Kids Learning"
  );

}


</script>
